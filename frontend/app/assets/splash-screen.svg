<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main gradient background -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- Animated-style background decorations -->
  <circle cx="100" cy="200" r="180" fill="#D1FAE5" opacity="0.15"/>
  <circle cx="950" cy="350" r="220" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="150" cy="1700" r="250" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1000" cy="1800" r="180" fill="#D1FAE5" opacity="0.12"/>
  
  <!-- Center logo area -->
  <g transform="translate(540, 700)" filter="url(#shadow)">
    <!-- Logo background circle -->
    <circle cx="0" cy="0" r="160" fill="#FFFFFF"/>
    
    <!-- Inner gradient circle -->
    <defs>
      <radialGradient id="innerGradient" cx="0%" cy="0%">
        <stop offset="0%" style="stop-color:#D1FAE5;stop-opacity:0.1" />
        <stop offset="100%" style="stop-color:#059669;stop-opacity:0.05" />
      </radialGradient>
    </defs>
    <circle cx="0" cy="0" r="155" fill="url(#innerGradient)"/>
    
    <!-- Calendar with medical cross icon -->
    <g transform="translate(0, 0)">
      <!-- Calendar frame -->
      <rect x="-70" y="-50" width="140" height="105" rx="10" fill="none" stroke="#059669" stroke-width="3"/>
      
      <!-- Calendar header -->
      <rect x="-70" y="-50" width="140" height="22" rx="10" fill="#059669"/>
      
      <!-- Calendar ring holes -->
      <rect x="-55" y="-60" width="10" height="12" rx="3" fill="#059669"/>
      <rect x="45" y="-60" width="10" height="12" rx="3" fill="#059669"/>
      
      <!-- Calendar dates indicator -->
      <circle cx="-40" cy="-35" r="3" fill="#D1FAE5"/>
      <circle cx="0" cy="-35" r="3" fill="#D1FAE5"/>
      <circle cx="40" cy="-35" r="3" fill="#D1FAE5"/>
      
      <!-- Medical cross -->
      <g transform="translate(0, 15)">
        <line x1="0" y1="-20" x2="0" y2="20" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="6" fill="#059669"/>
      </g>
      
      <!-- Checkmarks for scheduled appointments -->
      <g transform="translate(-50, 50)">
        <path d="M 0 0 L 2.5 3 L 8 -3" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(0, 50)">
        <path d="M 0 0 L 2.5 3 L 8 -3" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(50, 50)">
        <path d="M 0 0 L 2.5 3 L 8 -3" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  
  <!-- App title -->
  <text x="540" y="1150" font-size="70" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">MediAppoint</text>
  
  <!-- Subtitle -->
  <text x="540" y="1230" font-size="28" text-anchor="middle" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-weight="300">Healthcare Made Simple</text>
  
  <!-- Divider line -->
  <line x1="250" y1="1280" x2="830" y2="1280" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- Footer text -->
  <text x="540" y="1350" font-size="20" text-anchor="middle" fill="#FFFFFF" opacity="0.9" font-family="Segoe UI, Arial, sans-serif">Book appointments with trusted healthcare professionals</text>
  
  <!-- Bottom dots -->
  <circle cx="490" cy="1450" r="6" fill="#D1FAE5" opacity="0.7"/>
  <circle cx="540" cy="1450" r="6" fill="#FFFFFF"/>
  <circle cx="590" cy="1450" r="6" fill="#D1FAE5" opacity="0.7"/>
</svg>
